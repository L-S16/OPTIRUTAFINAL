name: optiruta
description: "Sistema Inteligente de Gestión y Optimización de Rutas"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.3
  flutter_polyline_points: ^3.1.0

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0

  # Estado
  provider: ^6.1.2

  # Mapas

  # GPS (VERSIÓN ESTABLE)

  # Imágenes
  image_picker: ^1.1.2
  signature: ^6.3.0
  url_launcher: ^6.3.2
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_optiruta.png

