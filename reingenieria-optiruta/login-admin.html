<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OPTIRUTA — Acceso Administrador</title>
  <meta name="description" content="Login del Super Administrador de OPTIRUTA"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/logo_optiruta.png" alt="Logo" onerror="this.style.display='none'"/>
      <h1>OPTIRUTA</h1>
      <p>Panel Administrador</p>
    </div>

    <h2 class="auth-title">👑 Super Administrador</h2>
    <p class="auth-sub">Ingresa tus credenciales para acceder al panel de control</p>

    <div id="alert-box"></div>

    <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Correo Electrónico</label>
        <input id="email" type="email" class="form-control" placeholder="admin@optiruta.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div style="position:relative;">
          <input id="password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password"/>
          <button type="button" onclick="togglePwd()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.5);font-size:.85rem;cursor:pointer;">👁</button>
        </div>
      </div>
      <button type="submit" class="auth-btn" id="btn-login">
        Ingresar al Panel
      </button>
    </form>

    <p class="auth-link">
      <a href="#" onclick="handleReset(event)">¿Olvidaste tu contraseña?</a>
    </p>
    <p class="auth-link" style="margin-top:8px;">
      <a href="index.html">← Volver a selección de perfil</a>
    </p>
  </div>
</div>

<script type="module">
  import { loginWithEmail, resetPassword } from "./js/auth.js";
  import { showToast } from "./js/utils.js";

  window.handleLogin = async function(e) {
    e.preventDefault();
    const btn   = document.getElementById("btn-login");
    const email = document.getElementById("email").value.trim();
    const pwd   = document.getElementById("password").value;
    const box   = document.getElementById("alert-box");

    btn.disabled = true; btn.textContent = "Verificando...";
    box.innerHTML = "";

    try {
      const { user, data } = await loginWithEmail(email, pwd);
      
      let finalData = data;
      
      if (data) {
        if (data.rol !== "Administrador") {
          const { auth } = await import("./js/firebase-config.js");
          const { signOut } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
          await signOut(auth);
          throw new Error(`Acceso denegado. No tienes permisos de Administrador.`);
        }
      } else {
        // Si no existe, crear el perfil de administrador por defecto (primer acceso)
        const { db } = await import("./js/firebase-config.js");
        const { doc, setDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
        finalData = {
          nombre: "Administrador",
          correo: email,
          rol: "Administrador",
          estado: true
        };
        await setDoc(doc(db, "usuarios", user.uid), {
          ...finalData,
          fechaRegistro: serverTimestamp()
        });
      }

      // Guardar sesión actualizada
      localStorage.setItem("or_uid", user.uid);
      localStorage.setItem("or_email", user.email);
      localStorage.setItem("or_name", finalData.nombre || "Administrador");
      localStorage.setItem("or_rol", "Administrador");

      showToast("¡Bienvenido, Administrador!", "success");
      setTimeout(() => { window.location.href = "dashboard-admin.html"; }, 800);
    } catch (err) {
      console.error("Error completo en Login:", err);
      const detail = err.code ? `[${err.code}] ` : "";
      box.innerHTML = `<div class="alert alert-danger">⚠️ ${detail}${err.message}</div>`;
      btn.disabled = false; btn.textContent = "Ingresar al Panel";
    }
  };

  window.handleReset = async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    if (!email) { showToast("Escribe tu correo primero", "warning"); return; }
    try {
      await resetPassword(email);
      showToast("Correo de recuperación enviado ✉️", "success");
    } catch (err) { showToast(err.message, "error"); }
  };

  window.togglePwd = function() {
    const f = document.getElementById("password");
    f.type = f.type === "password" ? "text" : "password";
  };
</script>
</body>
</html>
