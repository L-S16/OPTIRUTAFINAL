<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OPTIRUTA — Rutas</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo"><img src="assets/logo_optiruta.png" alt="" onerror="this.style.display='none'" style="width:32px;height:32px;"/><span>OPTIRUTA</span></div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="dashboard-admin.html"><span class="nav-icon">🏠</span> Dashboard</a>
    <a class="nav-item" href="reportes.html"><span class="nav-icon">📊</span> Reportes</a>
    <a class="nav-item" href="mapa-admin.html"><span class="nav-icon">🗺️</span> Monitoreo</a>
    <a class="nav-item" href="conductores.html"><span class="nav-icon">🚛</span> Conductores</a>
    <a class="nav-item" href="usuarios.html"><span class="nav-icon">👥</span> Usuarios</a>
    <a class="nav-item active" href="rutas.html"><span class="nav-icon">🗂️</span> Rutas</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar" id="sidebar-user-avatar">A</div>
      <div class="user-info"><div class="user-name" id="sidebar-user-name">Admin</div><div class="user-role" id="sidebar-user-role">Administrador</div></div>
      <button onclick="doLogout()" style="color:var(--slate-400);font-size:1.1rem;padding:4px;">🚪</button>
    </div>
  </div>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<header class="topbar">
  <div class="topbar-left">
    <button class="menu-btn btn-ghost" id="menu-btn">☰</button>
    <span class="page-breadcrumb">Admin · <strong>Rutas</strong></span>
  </div>
</header>

<main class="main-content">
  <div class="page-header">
    <h1 class="page-title">🗂️ Todas las Rutas</h1>
  </div>

  <div class="filters-bar">
    <select class="filter-select" id="f-estado" onchange="renderTabla()">
      <option value="">Todos los estados</option>
      <option>Asignado</option><option>En Ruta</option><option>Entregado</option><option>No entregado</option>
    </select>
  </div>

  <div class="card">
    <div class="card-body" style="padding:0;">
      <div class="table-wrapper">
        <table class="table">
          <thead><tr><th>ID Ruta</th><th>Conductor</th><th>Pedidos</th><th>Cajas</th><th>Estado</th><th>Fecha Creación</th></tr></thead>
          <tbody id="tabla-rutas">
            <tr><td colspan="6"><div class="empty-state"><div class="spinner"></div></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { requireAuth, populateSidebarUser, logout } from "./js/auth.js";
  import { initSidebar, estadoBadge, formatDate } from "./js/utils.js";
  import { listenTodasRutas } from "./js/rutas.js";

  if (!requireAuth("Administrador")) throw new Error("No autorizado");
  populateSidebarUser(); initSidebar();
  window.doLogout = logout;

  let allRutas = [];
  listenTodasRutas(r => { allRutas = r; window.renderTabla(); });

  window.renderTabla = function() {
    const est = document.getElementById("f-estado").value;
    const filtered = allRutas.filter(r => !est || r.estado === est);
    const tbody = document.getElementById("tabla-rutas");
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Sin rutas</div></div></td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(r => `
      <tr>
        <td><code style="font-size:.75rem;color:var(--primary);">${r.id.substring(0,14)}…</code></td>
        <td>${r.nombreConductor||"—"}</td>
        <td style="text-align:center;">${(r.pedidos||[]).length}</td>
        <td style="text-align:center;">${r.numeroCajas||0}</td>
        <td>${estadoBadge(r.estado||"—")}</td>
        <td style="font-size:.8rem;color:var(--slate-500);">${formatDate(r.fechaCreacion)}</td>
      </tr>
    `).join("");
  };
</script>
</body>
</html>
